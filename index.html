    <script>
    function updateClock() {
        const clockElement = document.getElementById('live-clock');
        const now = new Date();
        clockElement.innerText = now.toLocaleString('ko-KR', { 
            year: 'numeric', month: '2-digit', day: '2-digit', 
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
        });
    }
    setInterval(updateClock, 1000);

    async function fetchMeal() {
        const listContainer = document.getElementById('meal-list');
        const kcalContainer = document.getElementById('meal-kcal');
        const dateContainer = document.getElementById('meal-date');
        
        const now = new Date();
        const dateOptions = { month: 'long', day: 'numeric', weekday: 'long' };
        dateContainer.innerText = now.toLocaleDateString('ko-KR', dateOptions);

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const today = `${year}${month}${day}`;
        
        const apiKey = '2c792cf6bef54883844ae1bc214111cd';
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${apiKey}&Type=json&ATPT_OFCDC_SC_CODE=N10&SD_SCHUL_CODE=8140093&MLSV_YMD=${today}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.mealServiceDietInfo) {
                const row = data.mealServiceDietInfo[1].row[0];
                kcalContainer.innerText = row.CAL_INFO;
                const menuRaw = row.DDISH_NM.replace(/\([^)]*\)/g, "");
                const menuArray = menuRaw.split('<br/>').filter(m => m.trim() !== "");
                
                listContainer.innerHTML = ''; 
                menuArray.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "flex items-center";
                    li.innerHTML = `<span class="w-2 h-2 bg-sky-400 rounded-full mr-3 flex-shrink-0"></span>${item.trim()}`;
                    listContainer.appendChild(li);
                });
            } else {
                listContainer.innerHTML = "<li class='text-slate-400 font-normal'>오늘은 등록된 급식 정보가 없습니다.</li>";
                kcalContainer.innerText = "0 Kcal";
            }
        } catch (error) {
            console.error("API Error:", error);
            listContainer.innerHTML = "<li class='text-red-400'>데이터를 불러오는 중 오류가 발생했습니다.</li>";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateClock();
        fetchMeal();
    });
    </script>
